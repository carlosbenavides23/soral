[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "soral"
version = "0.1.0.dev1"
description = "Experimental HTTP acquisition and static inventory CLI"
requires-python = ">=3.11"

[project.scripts]
soral = "soral.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
